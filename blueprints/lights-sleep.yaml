blueprint:
  name: "Lights (Sleep)"
  description: "Manages lights during sleep mode based on room occupancy."
  domain: automation
  input:
    area_id:
      name: Area
      description: The target area where occupancy sensors and lights are managed.
      selector:
        area: {}
    automatic_lighting:
      name: Automatic Lighting
      description: The `input_boolean` used to enable or disable automatic lighting.
      default: input_boolean.automatic_lighting
      selector:
        entity:
          domain: input_boolean
    sleep_mode:
      name: Sleep Mode
      description: The `input_boolean` indicating that sleep mode is active.
      default: input_boolean.sleep_mode
      selector:
        entity:
          domain: input_boolean
    away_mode:
      name: Away Mode
      description: The `input_boolean` indicating that away mode is active.
      default: input_boolean.away_mode
      selector:
        entity:
          domain: input_boolean
    scene:
      name: Scene
      description: The scene to activate when occupancy is detected.
      selector:
        entity:
          domain: scene

mode: single

triggers:
  - trigger: occupancy.detected
    target:
      area_id: !input area_id
    options:
      behavior: first
      for: "00:00:00"
    id: occupancy-detected
  - trigger: occupancy.cleared
    target:
      area_id: !input area_id
    options:
      behavior: all
      for: "00:00:00"
    id: occupancy-cleared
  - trigger: switch.turned_on
    target:
      entity_id: !input sleep_mode
    options:
      behavior: each
      for: "00:00:00"
    id: sleep-mode-activated

conditions:
  - condition: switch.is_on
    target:
      entity_id: !input automatic_lighting
    options:
      behavior: any
      for: "00:00:00"
  - condition: switch.is_on
    target:
      entity_id: !input sleep_mode
    options:
      behavior: any
      for: "00:00:00"
  - condition: switch.is_off
    target:
      entity_id: !input away_mode
    options:
      behavior: any
      for: "00:00:00"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - occupancy-detected
        sequence:
          - action: scene.turn_on
            metadata: {}
            target:
              entity_id: !input scene
            data: {}
      - conditions:
          - condition: trigger
            id:
              - occupancy-cleared
        sequence:
          - action: light.turn_off
            metadata: {}
            target:
              area_id: !input area_id
            data: {}
      - conditions:
          - condition: trigger
            id:
              - sleep-mode-activated
          - condition: occupancy.is_detected
            target:
              area_id: !input area_id
            options:
              behavior: any
              for: "00:00:00"
        sequence:
          - action: scene.turn_on
            metadata: {}
            target:
              entity_id: !input scene
            data:
              transition: 60
      - conditions:
          - condition: trigger
            id:
              - sleep-mode-activated
          - condition: occupancy.is_not_detected
            target:
              area_id: !input area_id
            options:
              behavior: any
              for: "00:00:00"
        sequence:
          - action: light.turn_off
            metadata: {}
            target:
              area_id: !input area_id
            data: {}
