blueprint:
  name: Reset lighting mode
  domain: automation
  input:
    mode:
      name: Lighting Mode
      description: Select the input_select entity for the lighting mode.
      selector:
        entity:
          filter:
            domain: input_select
    manual_option:
      name: Manual Option
      description: Enter the option value that represents the manual mode state (e.g., Manuell).
      default: Manuell
      selector:
        text: {}
    reset_option:
      name: Reset Option
      description: Enter the option value to select when resetting the mode (e.g., Automatisk).
      default: Automatisk
      selector:
        text: {}
    away_mode:
      name: Away Mode
      description: Select the input_boolean entity for away mode.
      default: input_boolean.away_mode
      selector:
        entity:
          filter:
            domain: input_boolean
    sleep_mode:
      name: Sleep Mode
      description: Select the input_boolean entity for sleep mode.
      default: input_boolean.sleep_mode
      selector:
        entity:
          filter:
            domain: input_boolean
mode: single

triggers:
  - trigger: state
    entity_id: !input away_mode
    to: 'on'
  - trigger: state
    entity_id: !input sleep_mode
    to: 'off'

conditions:
  - condition: template
    value_template: "{{ is_state(input_mode, input_manual) }}"
  - condition: state
    entity_id: !input sleep_mode
    state: 'off'

actions:
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: !input mode
    data:
      option: !input reset_option
